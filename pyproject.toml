[project]
name = "reconciliation-agent"
version = "0.1.0"
description = "Agent-oriented finance reconciliation C-table generator and verifier."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.66.0",
  "openai>=1.0.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.5",
  "pydantic>=2.8.0",
  "python-dateutil>=2.9.0",
  "rapidfuzz>=3.9.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
