services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      PREVIEW_LLM_PROVIDER: ${PREVIEW_LLM_PROVIDER:-deepseek}
      PREVIEW_LLM_MODEL: ${PREVIEW_LLM_MODEL:-deepseek-chat}
      PREVIEW_LLM_BASE_URL: ${PREVIEW_LLM_BASE_URL:-https://api.deepseek.com}
      PREVIEW_LLM_API_KEY_ENV: ${PREVIEW_LLM_API_KEY_ENV:-DEEPSEEK_API_KEY}
      MAPPING_LLM_PROVIDER: ${MAPPING_LLM_PROVIDER:-deepseek}
      MAPPING_LLM_MODEL: ${MAPPING_LLM_MODEL:-deepseek-v4-flash}
      MAPPING_LLM_BASE_URL: ${MAPPING_LLM_BASE_URL:-https://api.deepseek.com}
      MAPPING_LLM_API_KEY_ENV: ${MAPPING_LLM_API_KEY_ENV:-DEEPSEEK_API_KEY}
    restart: unless-stopped
    volumes:
      - reconciliation_tasks:/app/backend/storage/tasks
      - reconciliation_outputs:/app/outputs
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  reconciliation_tasks:
  reconciliation_outputs:
